[project]
name = "hs-rag-classifier"
version = "0.1.0"
description = "Local RAG classifier suggesting UK commodity codes from product descriptions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hs_rag_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
