[project]
name = "hs-rag-classifier"
version = "0.1.0"
description = "Local RAG classifier suggesting UK commodity codes from product descriptions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "bm25s>=0.3.14",
    "httpx>=0.27",
    "matplotlib>=3.11.2",
    "mlflow>=3.15",
    "pandas>=3.0.6",
    "pyarrow>=25.0.0",
    "pydantic>=2.7",
    "pystemmer>=3.1.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# GPU embedding stack (B1, B1-ex): torch from the CUDA 12.8 index for the RTX 5070 Ti (sm_120).
# Kept out of the base dependencies; the base package imports without it.
ml = [
    "torch>=2.7",
    "sentence-transformers>=4.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hs_rag_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
