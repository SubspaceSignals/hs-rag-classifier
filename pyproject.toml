[project]
name = "hs-rag-classifier"
version = "0.1.0"
description = "Local RAG classifier suggesting UK commodity codes from product descriptions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "bm25s>=0.3.14",
    "httpx>=0.27",
    "matplotlib>=3.11.2",
    "mlflow>=3.15",
    "pandas>=3.0.6",
    "pyarrow>=25.0.0",
    "pydantic>=2.7",
    "pystemmer>=3.1.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
llm = [
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
]
# Opt-in tracing to a local Phoenix viewer (src/hs_rag_classifier/tracing.py). Exact pins: Phoenix
# 14.6.0 is the newest release that moves no locked package. 14.7 and later pull in
# pydantic-ai-slim[google], whose google-genai caps tenacity below 9.2; 20.21.1 and later (and
# 13.22 to 14.3) also need graphql-core 3.3, which MLflow's graphene 3 refuses. The exporters are
# held at 1.45.1 so MLflow's opentelemetry-sdk stays put.
tracing = [
    "arize-phoenix==14.6.0",
    "arize-phoenix-otel==0.17.2",
    "openinference-instrumentation-langchain==0.1.81",
    "opentelemetry-exporter-otlp==1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
]
# GPU embedding stack (B1, B1-ex): torch from the CUDA 12.8 index for the RTX 5070 Ti (sm_120).
# Kept out of the base dependencies; the base package imports without it.
ml = [
    "torch>=2.7",
    "sentence-transformers>=4.1",
    "transformers>=5.21",
]
# A4 QLoRA fine-tuning (with the ml group): PEFT adapters on a bitsandbytes NF4 base. Exact pins:
# the newest releases that move no locked package. No Unsloth (its releases cap transformers at
# 5.17) and no TRL (it needs datasets>=4.7, which caps fsspec at 2026.7 or needs
# huggingface-hub < 2); the trainer is a small answer-token loss on transformers and PEFT.
finetune = [
    "peft==0.21.2",
    "bitsandbytes==0.50.2",
    "accelerate==1.15.0",
]
# Local API (src/hs_rag_classifier/service, with llm and ml): exact pins at the versions MLflow
# already locks, so no locked package moves. httpx backs FastAPI's TestClient.
serve = [
    "fastapi==0.158.1",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hs_rag_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
